# Skryb quickstart

Skryb makes portable, editable technical documents from an ordinary HTML file.
The canonical Markdown and diagram YAML stay inside the file; the browser
runtime renders them into a readable document and saves updated copies.

:::callout { title="What you need" palette=accent }
A modern browser and one HTML file. Hosted-runtime documents need network
access when opened; use **Save for Offline** when the recipient must work
without it.
:::

## Create and open a document

1. [Download the basic document template](../templates/skryb-document-template.html).
   It has a title, introductory text, and editable flowchart.
2. Open the downloaded file directly in a browser, including through a local
   `file://` URL.
3. Choose **Edit source** in the document menu to replace the template content,
   then use **Save As** whenever you want a new document.
4. To start from scratch instead, use the HTML shell in the
   [reference](reference.html#html-document-shell). Put Markdown and diagram
   YAML in `template#source`; keep
   `main#rendered-document` empty.

Frontmatter controls document-wide style. `theme: auto` follows the viewer's
system setting; `light` and `dark` are fixed choices. Select `classic`, `ice`,
`midnight`, or `paper` with `colourScheme`. The document menu can change either
setting and writes the result back to frontmatter when you save.

## Add a flowchart

This flowchart is YAML in the document source. It shows a browser submitting an
order to an API. Flowchart edit mode can change node and connector presentation,
resize or duplicate nodes, reconnect edges, and drag a selected edge waypoint.

```diagram
type: flowchart
version: 1
id: first-flowchart
canvas:
  width: 720
  height: 300
nodes:
  - id: browser
    label: Browser
    shape: rounded-rectangle
    position: { x: 60, y: 110 }
    size: { width: 180, height: 80 }
    palette: accent
  - id: api
    label: Orders API
    shape: oval
    position: { x: 450, y: 110 }
    size: { width: 180, height: 80 }
    palette: success
edges:
  - source: browser
    target: api
    sourceAnchor: right
    targetAnchor: left
    label: POST /orders
    route: orthogonal
    end: arrow
```

Use the diagram toolbar to zoom, fit, or pan. Panning is visual only: it does
not alter the stored node and waypoint coordinates. Choose **Edit** to make
flowchart changes, then keep the edit to serialize them into the matching
diagram fence.

## Edit canonical source

**Edit source** opens the resizable source tray. Drag its top edge to change the
tray height, or focus that edge and use the arrow keys; double-click it to
restore the default height. It live-renders valid changes,
while preserving the last valid document and showing a precise error for an
invalid draft. Double-click rendered text to open the tray at its matching
source.

The tray menu inserts valid templates for a flowchart, sequence, diagram
reference, panel, or grid. Use it for document structure and all sequence
diagram changes; sequence participants appear left to right and messages appear
top to bottom in source order.

## Save the result

- **Save As** downloads an updated portable HTML document and retains its hosted
  runtime URL.
- **Save for Offline** downloads a self-contained HTML document with the
  selected runtime embedded at the end of its body.
- Cmd/Ctrl+S saves the latest valid source; Cmd/Ctrl+Shift+E opens or closes the
  source tray.

## Keep going

- Read the [Skryb reference](reference.html) for the supported document,
  formatting, flowchart, and sequence fields.

## Use Skryb with coding agents

Install the schema-aware `skryb-document` skill to make this authoring contract
available to every supported local agent:

```sh
npx skills add sparkkz-nz/skryb --skill skryb-document --agent '*' --global --yes --full-depth
```

Omit `--global` for a project-only install. Run `npx skills update --global` to
receive the latest version. The [skill source](https://github.com/sparkkz-nz/skryb/tree/main/.github/skills/skryb-document)
is versioned alongside Skryb.
