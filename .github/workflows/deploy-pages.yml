name: Deploy runtime to GitHub Pages

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check and test runtime
        run: |
          npm run check
          npm test

      - name: Build Pages site
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          site_dir="$RUNNER_TEMP/pages-site"
          site_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages "$site_remote" "$site_dir"
          else
            git init "$site_dir"
            (
              cd "$site_dir"
              git checkout --orphan gh-pages
              git remote add origin "$site_remote"
            )
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            destination="$site_dir/releases/$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            destination="$site_dir/latest"
          else
            destination="$site_dir/dev"
          fi
          mkdir -p "$destination"
          cp dist/skryb-runtime.js "$destination/skryb-runtime.js"
          cp hello-runtime.js "$site_dir/hello-runtime.js"
          mkdir -p "$site_dir/docs"
          cp pages/docs/*.html "$site_dir/docs/"
          cp pages/index.html "$site_dir/index.html"
          cp pages/docs/quickstart.html "$site_dir/docs/index.html"
          cp pages/docs/reference.html "$site_dir/reference.html"

          (
            cd "$site_dir"
            git add .
            if ! git diff --cached --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "Publish ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
              git push origin HEAD:gh-pages
            fi
            rm -rf .git
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
