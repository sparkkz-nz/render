name: Deploy runtime to GitHub Pages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test runtime
        run: node --test test/render-runtime.test.js

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail

          site_dir="$RUNNER_TEMP/pages-site"
          git fetch --no-tags origin main:refs/remotes/origin/main
          mkdir -p "$site_dir/dev" "$site_dir/releases"
          git show "origin/main:render-runtime.js" > "$site_dir/render-runtime.js"
          git show "origin/main:hello.html" > "$site_dir/hello.html"
          git show "origin/main:hello-runtime.js" > "$site_dir/hello-runtime.js"
          git show "origin/main:pages/index.html" > "$site_dir/index.html"

          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            dev_revision="$GITHUB_SHA"
          else
            dev_revision="origin/main"
          fi
          git show "$dev_revision:render-runtime.js" > "$site_dir/dev/render-runtime.js"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            release_dir="$site_dir/releases/$tag"
            mkdir -p "$release_dir"
            git show "$tag:render-runtime.js" > "$release_dir/render-runtime.js"
          done < <(git tag --list "v*" --sort=version:refname)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
